      function flattenHistories(histories) {
        return Object.values(histories).flatMap((items) => Array.isArray(items) ? items : []);

      function uniqueAffectedLocomotives(events, histories = {}) {
        return new Set([
          ...events.map((event) => event.locomotoraCodigo).filter(Boolean),
          ...flattenHistories(histories).map((item) => item.locomotoraCodigo).filter(Boolean),
        ]).size;

      function cleanupResult(removedEvents, affectedLocomotives) {
        return {

          affectedLocomotives,
          cleanedAt: new Date().toLocaleString('es-AR'),

      function clearAllHistoricalEvents() {
        const removedEvents = state.historyCustomEvents.length + flattenHistories(state.histories).length + (state.mockEventsDisabled ? 0 : sampleEvents7774.length);

        state.historyCustomEvents = [];
        state.histories = {};
        state.mockEventsDisabled = true;
        saveCustomHistoryEvents();
        saveHistories();
        saveMockEventsDisabled(true);
        return cleanupResult(removedEvents, affectedLocomotives);
      }

        saveHistories();

      function clearMockEvents() {

        const beforeHistories = flattenHistories(state.histories);

          ...state.historyCustomEvents.filter((event) => event.isMock).map((event) => event.locomotoraCodigo || '7774').filter(Boolean),

          ...(state.mockEventsDisabled ? [] : ['7774']),
        ]);
        state.historyCustomEvents = state.historyCustomEvents.filter((event) => !event.isMock);
        Object.entries(state.histories).forEach(([locoId, items]) => {
          state.histories[locoId] = Array.isArray(items) ? items.filter((item) => !item.isMock) : [];

        saveHistories();

            ? items.filter((item) => !item.isMock && !String(item.id || '').startsWith('evt-7774-'))

        saveCustomHistoryEvents();
        saveHistories();
        localStorage.setItem(migrationKey, 'done');

      function todayInputValue() {
        return new Date().toISOString().slice(0, 10);
      }

      function formatDateDisplay(value) {
        if (!value) return '';
        const [year, month, day] = String(value).slice(0, 10).split('-');
        if (!year || !month || !day) return value;
        return `${day}-${month}-${year}`;
      }

      function parseDisplayDate(value) {
        const text = String(value || '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;

        const match = text.match(/^(\d{2})-(\d{2})-(\d{4})$/);
        if (!match) return text;

        const [, day, month, year] = match;
        return `${year}-${month}-${day}`;
      }

      function todayDisplayValue() {
        return formatDateDisplay(todayInputValue());
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function estadoEtiqueta(loco) {
        if (loco.lavadoProgramado) return 'Programada para Lavado';
        if (loco.estado === 'servicio') return 'En Servicio';
        if (loco.estado === 'preventivo') {
          if (loco.tipoPreventivo && loco.modalidad) return `Preventivo ${loco.tipoPreventivo} - ${loco.modalidad}`;
          if (loco.tipoPreventivo) return `Preventivo ${loco.tipoPreventivo}`;
          return 'Mantenimiento Preventivo';
        }
        return 'Mantenimiento Correctivo';
      }

      function estadoClase(estado) {
        if (estado === 'lavado') return 'is-wash';
        if (estado === 'servicio') return 'is-service';
        if (estado === 'preventivo') return 'is-preventive';
        return 'is-corrective';
      }

      function estadoOperativo(loco) {
        if (!loco) return '';
        return loco.estado === 'servicio' || loco.lavadoProgramado ? 'Operativa' : 'Mantenimiento';
      }

      function estadoOperativoClase(loco) {
        return estadoOperativo(loco) === 'Operativa' ? 'is-service' : 'is-preventive';
      }

      function areaClase(area) {
        if (area === 'Electrica') return 'electrical';
        if (area === 'Mecanica') return 'mechanical';
        return 'general';
      }

      function dotClase(area) {
        if (area === 'Electrica') return 'electric';
        if (area === 'Mecanica') return 'mechanic';
        return 'service';
      }

      function normalizeHistoryItem(item, loco) {
        const interventionClass = item.interventionClass || interventionClassFromType(item.type);
        const preventiveCode = interventionClass === 'preventivo' ? item.preventiveCode || item.preventiveType || '' : '';
        const preventiveFamily = interventionClass === 'preventivo'
          ? item.preventiveFamily || (String(preventiveCode || item.type || '').toLowerCase().includes('numeral') ? 'numeral' : 'liviana')
          : '';
        const modality = interventionClass === 'preventivo'
          ? preventiveFamily === 'numeral'
            ? item.modality || item.modalidad || 'Interno'
            : 'Interno'
          : '';

        return {
          ...item,
          interventionClass,
          preventiveFamily,
          preventiveCode,
          modality,
          type: item.type || interventionLabels[interventionClass] || 'Intervencion',
          locomotoraId: item.locomotoraId || loco.id,
          locomotoraCodigo: item.locomotoraCodigo || loco.codigo,
          area: item.area || 'General',
        };
      }

      function interventionClassFromType(type) {
        const normalized = String(type || '').trim().toLowerCase();
        if (normalized.includes('prevent')) return 'preventivo';
        if (normalized.includes('lavado')) return 'lavado';
        if (normalized.includes('inspe')) return 'inspeccion';
        if (normalized.includes('prueba')) return 'prueba';
        return 'correctivo';
      }

      function interventionTitle(item) {
        if (item.interventionClass !== 'preventivo') {
          return interventionLabels[item.interventionClass] || item.type || 'Intervencion';
        }

        const code = item.preventiveCode || 'sin codigo';
        const modality = item.modality === 'Externo' ? ' - Externo' : '';
        return `Preventivo ${code}${modality}`;
      }

      function shouldMergeCorrective(existing, incoming) {
        const existingClass = existing.interventionClass || interventionClassFromType(existing.type);

        return (
          incoming.interventionClass === 'correctivo'
          && existingClass === 'correctivo'
          && incoming.technician === existing.technician
          && incoming.date === existing.date
          && incoming.area === existing.area
          && ['Mecanica', 'Electrica'].includes(incoming.area)
        );
      }

      function mergeInterventionDetails(existing, incoming) {
        const currentDetail = String(existing.detail || '').trim();
        const nextDetail = String(incoming.detail || '').trim();

        return {
          ...existing,
          detail: [currentDetail, nextDetail].filter(Boolean).join('\n'),
          mergedCount: (existing.mergedCount || 1) + 1,
          updatedAt: new Date().toISOString(),
        };
      }

      function sortHistoryDescending(items) {
        return [...items].sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.id || 0) - (a.id || 0));
      }

        const sidePanel = document.querySelector('.side-panel');
        if (sidePanel) {
          sidePanel.outerHTML = sidePanelHtml(selectedLoco(), totals());
          bindPanelControls();
        }

        const node = document.querySelector(`[data-loco-id="${id}"]`);
        const viewport = document.querySelector('.yard-viewport');
        if (shouldCenter && node && viewport) {
          viewport.scrollTo({
            left: Math.max(node.offsetLeft - viewport.clientWidth / 2, 0),
            top: Math.max(node.offsetTop - 180, 0),
            behavior: 'smooth',
          });
        }
      }

      function handleHistoryCleanup(action) {

          if (typed !== 'ELIMINAR HISTORIAL') return;

          return;

        if (action === 'book') {
          if (!confirm('Eliminar solamente eventos importados cuyo origen sea Libro de novedades Ferrovias?')) return;

          return;
        }

        if (action === 'mock') {

        }

        if (action === 'calendar') {

      function findHistoryEventById(id) {

      function openStoredPdf(eventId) {
        const event = findHistoryEventById(eventId);
        const url = event?.attachments?.pdfUrl;
        if (!url) {
          alert('Este PDF no esta guardado localmente. Vuelva a adjuntar la planilla para poder abrirla desde el historial.');
          return;
        }
        const byteCharacters = atob(url.split(',')[1] || '');
        const byteNumbers = Array.from(byteCharacters, (char) => char.charCodeAt(0));
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
        const blobUrl = URL.createObjectURL(blob);
        const viewer = window.open(blobUrl, '_blank');
        if (!viewer) {
          URL.revokeObjectURL(blobUrl);
          alert('El navegador bloqueo la apertura del PDF.');

      function registerIntervention(event) {
        event.preventDefault();
        if (!state.selectedId) return;

        const form = new FormData(event.currentTarget);
        const interventionClass = form.get('interventionClass');
        const preventiveCode = interventionClass === 'preventivo' ? form.get('preventiveCode') : '';
        const preventiveFamily = interventionClass === 'preventivo' && String(preventiveCode).startsWith('Numeral') ? 'numeral' : interventionClass === 'preventivo' ? 'liviana' : '';
        const technician = interventionClass === 'preventivo'
          ? preventiveFamily === 'numeral'
            ? 'Turno fijo'
            : 'Turno rotativo'
          : form.get('technician');
        const intervention = {
          id: Date.now(),
          date: parseDisplayDate(form.get('date')),
          type: interventionLabels[interventionClass],
          interventionClass,
          preventiveFamily,
          preventiveCode,
          modality: interventionClass === 'preventivo' ? 'Interno' : '',
          area: interventionClass === 'preventivo' ? 'General' : form.get('area'),
          locomotoraId: state.selectedId,
          locomotoraCodigo: selectedLoco()?.codigo,
          technician: technician || 'Sin tecnico asignado',
          detail: form.get('detail'),
        };
        const currentItems = state.histories[state.selectedId] || [];
        const mergeIndex = currentItems.findIndex((item) => shouldMergeCorrective(item, intervention));

        const nextItems = mergeIndex >= 0
          ? currentItems.map((item, index) => (index === mergeIndex ? mergeInterventionDetails(item, intervention) : item))
          : [intervention, ...currentItems];

        state.histories = {
          ...state.histories,
          [state.selectedId]: sortHistoryDescending(nextItems),

        saveHistories();
        state.interventionOpen = false;
        render();

      function parseSemicolonCsvLine(line) {
        const cells = [];
        let value = '';
        let quoted = false;
        for (let index = 0; index < line.length; index += 1) {
          const char = line[index];
          const next = line[index + 1];
          if (char === '"' && quoted && next === '"') {
            value += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === ';' && !quoted) {
            cells.push(value.trim());
            value = '';
          } else {
            value += char;
          }
        }
        cells.push(value.trim());
        return cells.map((cell) => cell.replace(/^"|"$/g, '').trim());
      }

      function normalizeBookDate(value) {
        const raw = String(value || '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
        const match = raw.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/);
        if (!match) return '';
        const day = match[1].padStart(2, '0');
        const month = match[2].padStart(2, '0');
        const year = match[3].length === 2 ? `20${match[3]}` : match[3];
        return `${year}-${month}-${day}`;
      }

      function normalizeBookTime(value) {
        const raw = String(value || '').trim();
        const match = raw.match(/^(\d{1,2}):(\d{2})/);
        if (!match) return '';
        return `${match[1].padStart(2, '0')}:${match[2]}`;
      }

      function bookImportKey(nro, fecha, hora, unidad) {
        return `libro-novedades-${nro}-${fecha}-${hora}-${unidad}`;
      }

      function normalizeImportValue(value) {
        return String(value || '').trim().replace(/\s+/g, ' ').toUpperCase();
      }

      function escapeRegex(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function cleanBookDetail(value, unidad) {
        const prefixPattern = new RegExp(`^\\s*LOCOMOTORA\\s*:\\s*${escapeRegex(unidad)}\\s*:\\s*`, 'i');
        const cleaned = String(value || '')
          .replace(prefixPattern, '')
          .replace(/\s+/g, ' ')
          .trim();
        return cleaned ? cleaned.charAt(0).toUpperCase() + cleaned.slice(1) : '';
      }

      function formatBookDescription(details) {
        return details.map((detail) => `• ${detail}`).join('\n');
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      async function buildLocalAttachments(files) {
        const pdfFiles = files.filter((file) => file.type === 'application/pdf' || String(file.name).toLowerCase().endsWith('.pdf'));
        const photoFiles = files.filter((file) => file.type?.startsWith('image/'));
        const otFiles = files.filter((file) => String(file.name).toLowerCase().includes('ot'));
        const firstPdf = pdfFiles[0];

        return {
          pdf: pdfFiles.length > 0,
          pdfName: pdfFiles.map((file) => file.name).join(', '),
          pdfUrl: firstPdf ? await readFileAsDataUrl(firstPdf) : '',
          photo: photoFiles.length > 0,
          photoName: photoFiles.map((file) => file.name).join(', '),
          ot: otFiles.length > 0,
          otName: otFiles.map((file) => file.name).join(', '),
        };
      }

      function extractBookDetails(event) {
        if (Array.isArray(event.detalles)) return event.detalles.map((detail) => String(detail).trim()).filter(Boolean);
        return String(event.description || event.detail || '')
          .split(/\r?\n/)
          .map((line) => line.replace(/^•\s*/, '').trim())
          .filter(Boolean);
      }

      function bookImportKeyFromEvent(event) {
        if (event.libroKey) return event.libroKey;
        const nro = event.nroLibro;
        const fecha = event.date || event.fecha;
        const hora = event.time || event.hora;
        const unidad = event.locomotoraCodigo;
        return nro && fecha && hora && unidad ? bookImportKey(nro, fecha, hora, unidad) : event.id;
      }

      function importHistoryJson(text) {
        const payload = JSON.parse(text);
        const importedHistories = payload.histories || payload;
        const merged = { ...state.histories };
        Object.entries(importedHistories).forEach(([locoId, items]) => {
          const currentItems = merged[locoId] || [];
          const knownIds = new Set(currentItems.map((item) => item.id));
          const newItems = Array.isArray(items) ? items.filter((item) => !knownIds.has(item.id)) : [];
          merged[locoId] = [...newItems, ...currentItems].sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id)));
        });
        state.histories = merged;
        if (Array.isArray(payload.historyCustomEvents)) {
          const knownEventIds = new Set(state.historyCustomEvents.map((item) => item.id));
          state.historyCustomEvents = [
            ...payload.historyCustomEvents.filter((item) => !knownEventIds.has(item.id)),
            ...state.historyCustomEvents,
          ];
          saveCustomHistoryEvents();
        }
        saveHistories();
        render();
      }

      function isBookImportedEvent(item) {
        const origin = normalizeImportValue(item.origin || item.area || '');
        return origin === 'LIBRO DE NOVEDADES FERROVIAS' || origin === 'LIBRO DE NOVEDADES FERROVÍAS';
      }

      function removeImportedBookEvents() {
        state.historyCustomEvents = state.historyCustomEvents.filter((event) => !isBookImportedEvent(event));
        Object.entries(state.histories).forEach(([locoId, items]) => {
          state.histories[locoId] = Array.isArray(items) ? items.filter((item) => !isBookImportedEvent(item)) : [];
        });
      }

      function importBookCsv(text, options = {}) {
        const batchId = `libro-${Date.now()}`;
        const importedAt = new Date().toISOString();
        if (options.reprocess) {
          removeImportedBookEvents();
        }
        const validUnits = new Set(locomotoras.map((loco) => normalizeImportValue(loco.codigo)));
        const locoByCode = new Map(locomotoras.map((loco) => [normalizeImportValue(loco.codigo), loco]));
        const existingEvents = new Map();
        state.historyCustomEvents.forEach((event) => {
          const key = bookImportKeyFromEvent(event);
          if (key) existingEvents.set(key, event);
        });

        const summary = {
          filasLeidas: 0,
          novedadesAgrupadas: 0,
          eventosNuevos: 0,
          eventosActualizados: 0,
          duplicadosIgnorados: 0,
          unidadesNoReconocidas: 0,
          novedadesSinTipoUnidad: 0,
          novedadesSinUnidad: 0,
          novedadesNoLocomotora: 0,
          filasIgnoradas: 0,
        };
        const groups = new Map();
        const importedHistories = {};
        const context = {
          nro: '',
          estado: '',
          fecha: '',
          hora: '',
        };

        text.split(/\r?\n/).forEach((line, index) => {
          if (!line.trim()) return;
          summary.filasLeidas += 1;
          const cells = parseSemicolonCsvLine(line);
          while (cells.length < 7) cells.push('');

          const explicitNro = cells[0]?.trim() || '';
          if (explicitNro) {
            if (!/^\d+$/.test(explicitNro)) {
              context.nro = '';
              context.estado = '';
              context.fecha = '';
              context.hora = '';
              summary.filasIgnoradas += 1;
              return;
            }
            context.nro = explicitNro;
            context.estado = cells[1]?.trim() || context.estado;
            context.fecha = cells[2]?.trim() || context.fecha;
            context.hora = cells[3]?.trim() || context.hora;
          } else if (!context.nro) {
            summary.filasIgnoradas += 1;
            return;
          }

          if (cells[1]?.trim()) context.estado = cells[1].trim();
          if (cells[2]?.trim()) context.fecha = cells[2].trim();
          if (cells[3]?.trim()) context.hora = cells[3].trim();

          const fecha = normalizeBookDate(context.fecha);
          const hora = normalizeBookTime(context.hora);
          const detalle = cells.slice(6).join(' ').trim();

          if (!fecha || !hora || !detalle) {
            summary.filasIgnoradas += 1;
            return;
          }

          const baseKey = `${context.nro}-${fecha}`;
          const group = groups.get(baseKey) || {
            baseKey,
            nro: context.nro,
            estado: context.estado,
            fecha,
            hora,
            tipoUnidad: '',
            unidad: '',
            detalles: [],
            filasOrigen: [],
          };
          if (context.estado) group.estado = context.estado;
          if (cells[4]?.trim()) group.tipoUnidad = cells[4].trim();
          if (cells[5]?.trim()) group.unidad = cells[5].trim();
          if (cells[3]?.trim()) group.hora = normalizeBookTime(cells[3].trim()) || group.hora;
          group.filasOrigen.push(index + 1);

          const cleanedDetail = cleanBookDetail(detalle, group.unidad || cells[5]?.trim() || '');
          if (!cleanedDetail) {
            summary.filasIgnoradas += 1;
            groups.set(baseKey, group);
            return;
          }
          if (group.detalles.includes(cleanedDetail)) {
            summary.duplicadosIgnorados += 1;
          } else {
            group.detalles.push(cleanedDetail);
          }
          groups.set(baseKey, group);
        });

        summary.novedadesAgrupadas = groups.size;
        const newEvents = [];

        groups.forEach((group) => {
          const tipoUnidad = normalizeImportValue(group.tipoUnidad);
          const unidad = normalizeImportValue(group.unidad);
          if (!tipoUnidad) {
            summary.novedadesSinTipoUnidad += 1;
            return;
          }
          if (tipoUnidad !== 'LOCOMOTORA') {
            summary.novedadesNoLocomotora += 1;
            return;
          }
          if (!unidad) {
            summary.novedadesSinUnidad += 1;
            return;
          }
          if (!validUnits.has(unidad)) {
            summary.unidadesNoReconocidas += 1;
            return;
          }
          if (group.detalles.length === 0) {
            summary.filasIgnoradas += 1;
            return;
          }

          const key = bookImportKey(group.nro, group.fecha, group.hora, unidad);
          const existing = existingEvents.get(group.key);
          const existingByNewKey = existingEvents.get(key);
          const existingItem = existingByNewKey || existing;
          const existingDetails = existingItem ? extractBookDetails(existingItem) : [];
          const missingDetails = group.detalles.filter((detail) => !existingDetails.includes(detail));

          if (existingItem && missingDetails.length === 0) {
            summary.duplicadosIgnorados += 1;
            return;
          }

          const details = existingItem ? [...existingDetails, ...missingDetails] : group.detalles;
          const description = formatBookDescription(details);

          const eventItem = {
            ...(existingItem || {}),
            id: key,
            libroKey: key,
            locomotoraCodigo: unidad,
            date: group.fecha,
            dateLabel: formatHistoryDateLabel(group.fecha),
            time: group.hora,
            kind: 'libro',
            origin: 'Libro de novedades Ferrovias',
            description,
            detalles: details,
            responsible: 'Sistema Ferrovias',
            automatic: true,
            attachments: {},
            nroLibro: group.nro,
            estadoLibro: group.estado,
            criticidad: 'baja',
            importBatchId: batchId,
            nombreArchivoOrigen: options.fileName || '',
            fechaImportacion: importedAt,
            filasOrigen: group.filasOrigen,
          };

          if (existingItem) {
            state.historyCustomEvents = state.historyCustomEvents.map((event) => bookImportKeyFromEvent(event) === key ? eventItem : event);
            summary.eventosActualizados += 1;
          } else {
            newEvents.push(eventItem);
            summary.eventosNuevos += 1;
          }

          const loco = locoByCode.get(unidad);
          if (loco) {
            importedHistories[loco.id] = importedHistories[loco.id] || [];
            importedHistories[loco.id].push({
              id: key,
              libroKey: key,
              date: group.fecha,
              type: 'Libro de novedades',
              interventionClass: 'libro',
              preventiveCode: '',
              area: 'Libro de novedades Ferrovias',
              locomotoraId: loco.id,
              locomotoraCodigo: unidad,
              technician: 'Sistema Ferrovias',
              detail: description,
              automatic: true,
              nroLibro: group.nro,
              estadoLibro: group.estado,
              criticidad: 'baja',
              importBatchId: batchId,
              nombreArchivoOrigen: options.fileName || '',
              fechaImportacion: importedAt,
              filasOrigen: group.filasOrigen,
            });
          }
        });

        if (newEvents.length > 0 || summary.eventosActualizados > 0) {
          state.historyCustomEvents = [...newEvents, ...state.historyCustomEvents].sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.time).localeCompare(String(a.time)));
          Object.entries(importedHistories).forEach(([locoId, items]) => {
            const byId = new Map((state.histories[locoId] || []).map((item) => [item.id, item]));
            items.forEach((item) => byId.set(item.id, item));
            state.histories = {
              ...state.histories,
              [locoId]: sortHistoryDescending([...byId.values()]),
            };
          });
          saveCustomHistoryEvents();
          saveHistories();
        }
        render();
        alert([
          'Importacion Libro de Novedades',
          `Filas leidas: ${summary.filasLeidas}`,
          `Novedades agrupadas: ${summary.novedadesAgrupadas}`,
          `Eventos validos importados: ${summary.eventosNuevos}`,
          `Eventos actualizados con detalles adicionales: ${summary.eventosActualizados}`,
          `Duplicados exactos ignorados: ${summary.duplicadosIgnorados}`,
          `Novedades descartadas por no tener Tipo Unidad: ${summary.novedadesSinTipoUnidad}`,
          `Novedades descartadas por no tener Unidad: ${summary.novedadesSinUnidad}`,
          `Unidades no reconocidas: ${summary.unidadesNoReconocidas}`,
          `Novedades descartadas por no ser locomotoras: ${summary.novedadesNoLocomotora}`,
          `Filas ignoradas: ${summary.filasIgnoradas}`,
        ].join('\n'));
      }

      function importHistoryBackup(event, options = {}) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          try {
            const text = String(reader.result || '');
            if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
              importHistoryJson(text);
            } else {
              importBookCsv(text, { ...options, fileName: file.name });
            }
          } catch {
            alert('No se pudo importar el archivo de historial.');
          } finally {
            event.target.value = '';
          }
        };
        reader.readAsText(file);
      }

      function calendarTaskTone(task) {
        if (task.estado === 'vencida' || task.date < '2026-06-22') return 'vencida';
        if (task.tipo === 'campana') return 'campana';
        if (task.tipo === 'numeral') return 'numeral';
        if (task.tipo.startsWith('preventivo')) return 'preventivo';
        return 'otro';
      }

      function calendarTaskLabel(task) {
        if (task.tipo === 'campana') return `Campana: ${task.descripcion.replace(/\.$/, '')}`;
        if (task.tipo === 'numeral') return task.descripcion;
        if (task.tipo === 'preventivo-locomotora') return `${task.unidad} Preventivo ${task.preventivoCodigo || task.descripcion.replace(`${task.unidad}.`, '').trim()}`;
        if (task.tipo === 'preventivo-coche') return `${task.unidad} preventivo`;
        return task.descripcion;
      }

      function nextCalendarDate(value, frequency) {
        const date = new Date(`${value}T00:00:00`);
        if (frequency === 'semanal') date.setDate(date.getDate() + 7);
        else if (frequency === 'quincenal') date.setDate(date.getDate() + 14);
        else if (frequency === 'mensual') date.setMonth(date.getMonth() + 1);
        else if (frequency === 'bimestral') date.setMonth(date.getMonth() + 2);
        else if (frequency === 'trimestral') date.setMonth(date.getMonth() + 3);
        else if (frequency === 'semestral') date.setMonth(date.getMonth() + 6);
        else if (frequency === 'anual') date.setMonth(date.getMonth() + 12);
        return date.toISOString().slice(0, 10);
      }

      function buildCalendarOccurrences(month) {
        const monthStart = new Date(`${month}-01T00:00:00`);
        const monthEnd = new Date(monthStart);
        monthEnd.setMonth(monthEnd.getMonth() + 1);
        return state.calendarTasks.flatMap((task) => {
          if (task.fechaFin) {
            const start = new Date(`${task.fechaProgramada}T00:00:00`);
            const end = new Date(`${task.fechaFin}T00:00:00`);
            if (start < monthEnd && end >= monthStart) {
              const visibleDate = start > monthStart ? task.fechaProgramada : `${month}-01`;
              return [{ ...task, date: visibleDate, occurrenceId: `${task.id}-${month}` }];
            }
            return [];
          }
          const events = [];
          let date = task.fechaProgramada;
          let guard = 0;
          while (date && guard < 30) {
            const current = new Date(`${date}T00:00:00`);
            if (current >= monthStart && current < monthEnd) events.push({ ...task, date, occurrenceId: `${task.id}-${date}` });
            if (task.frecuencia === 'unica' || current >= monthEnd) break;
            date = nextCalendarDate(date, task.frecuencia);
            guard += 1;
          }
          return events;
        });
      }

      function calendarOccurrences() {
        return buildCalendarOccurrences(state.calendarMonth)
          .sort((a, b) => a.date.localeCompare(b.date));
      }

      function calendarDays() {
        const [year, month] = state.calendarMonth.split('-').map(Number);
        const first = new Date(year, month - 1, 1);
        const leading = (first.getDay() + 6) % 7;
        const total = new Date(year, month, 0).getDate();
        return [...Array(leading).fill(null), ...Array.from({ length: total }, (_, index) => `${year}-${String(month).padStart(2, '0')}-${String(index + 1).padStart(2, '0')}`)];
      }

            function calendarHtml() {
        const occurrences = calendarOccurrences();
        const annualTasks = Array.from({ length: 12 }, (_, index) => `2026-${String(index + 1).padStart(2, '0')}`)
          .flatMap((month) => buildCalendarOccurrences(month))
          .filter((task) => task.tipo === 'campana' || task.tipo === 'numeral' || (task.nivelPlanificacion === 'anual' && !task.tipo.startsWith('preventivo')));
        const byDay = occurrences.reduce((groups, task) => ({ ...groups, [task.date]: [...(groups[task.date] || []), task] }), {});
        const weekly = occurrences.filter((task) => task.date >= '2026-06-22' && task.date <= '2026-06-28');

              ${state.calendarView === 'mensual' ? `<section class="maintenance-month"><div class="calendar-section-heading"><h3>Junio 2026</h3><div class="calendar-filter-row"><label><input type="checkbox" checked />Campanas</label><label><input type="checkbox" checked />Numerales</label><label><input type="checkbox" checked />Preventivos</label><label><input type="checkbox" checked />Coches</label><label><input type="checkbox" checked />Locomotoras</label></div></div><div class="month-grid weekdays">${['Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab', 'Dom'].map((day) => `<span>${day}</span>`).join('')}</div><div class="month-grid">${calendarDays().map((day) => `<div class="month-day ${day ? '' : 'is-empty'} ${day === '2026-06-22' ? 'is-today' : ''}">${day ? `<strong>${Number(day.slice(-2))}</strong><div class="month-day-tasks">${(byDay[day] || []).slice(0, 3).map((task) => `<span class="${calendarTaskTone(task)}">${escapeHtml(calendarTaskLabel(task))}</span>`).join('')}</div>` : ''}</div>`).join('')}</div></section>` : ''}
              ${state.calendarView === 'semanal' ? `<section class="weekly-agenda"><div class="calendar-section-heading"><h3>Vista semanal operativa</h3><span>22-06-2026 al 28-06-2026</span></div><div class="week-column-grid">${['Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado', 'Domingo'].map((day, index) => { const date = `2026-06-${String(22 + index).padStart(2, '0')}`; const tasks = weeklyByDay[date] || []; return `<section class="week-column"><header><strong>${day}</strong><span>${formatDateDisplay(date)}</span></header>${tasks.map((task) => `<article class="${calendarTaskTone(task)}"><strong>${escapeHtml(calendarTaskLabel(task))}</strong><span>${escapeHtml(task.activo)}</span></article>`).join('')}${tasks.length ? '' : '<p>Sin programacion</p>'}</section>`; }).join('')}</div></section>` : ''}

      function eventTypeLabel(kind) {
        return {
          preventivo: 'Preventivo',
          correctivo: 'Correctivo',
          libro: 'Libro de novedades',
          alistamiento: 'Novedad de alistamiento',
          numeral: 'Numeral',
          lavado: 'Lavado',
        }[kind] || kind;
      }

      function historyEventMatchesFilter(event) {
        if (state.historyEventFilter === 'todo') return true;
        if (state.historyEventFilter === 'adjuntos') {
          return Boolean(event.attachments?.pdf || event.attachments?.photo || event.attachments?.ot);
        }
        return event.kind === state.historyEventFilter;
      }

      function historyEventMatchesSearch(event) {
        const query = state.historySearch.trim().toLowerCase();
        if (!query) return true;

        return [
          event.dateLabel,
          event.time,
          event.origin,
          event.description,
          event.responsible,
          event.kind,
        ].join(' ').toLowerCase().includes(query);
      }

      function groupHistoryEvents(events) {
        return events.reduce((groups, event) => {
          const existing = groups.find((group) => group.date === event.date);
          if (existing) {
            existing.events.push(event);
            return groups;
          }

          return [...groups, { date: event.date, label: event.dateLabel, events: [event] }];
        }, []);
      }

      function formatHistoryDateLabel(value) {
        const months = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
        const [year, month, day] = String(value).split('-');
        return `${day} ${months[Number(month) - 1] || ''} ${year}`;
      }

      function timelineEventHtml(event) {
        return `
          <article class="timeline-event-card ${event.kind} ${event.criticidad === 'alta' ? 'is-critical' : ''}">
            <time>${event.time}</time>
            <div class="timeline-event-marker"></div>
            <div class="timeline-event-body">
              <div class="timeline-event-topline">
                <strong>${eventTypeLabel(event.kind)}</strong>
                <span>${escapeHtml(event.origin)}</span>
                ${event.automatic ? '<em>Automatico</em>' : ''}
              </div>
              <p>${escapeHtml(event.description)}</p>
              <div class="timeline-event-meta">
                ${event.responsible ? `<span>Responsable: ${escapeHtml(event.responsible)}</span>` : ''}
                ${event.attachments?.pdf ? `<button data-open-attachment="pdf" data-event-id="${escapeHtml(event.id)}" title="Doble click para abrir PDF" type="button">PDF</button>` : ''}
                ${event.attachments?.photo ? '<button type="button">Foto</button>' : ''}
                ${event.attachments?.ot ? '<button type="button">OT</button>' : ''}
              </div>
            </div>
          </article>
        `;
      }

        const realEventsForLoco = state.historyCustomEvents.filter((event) => event.locomotoraCodigo === loco.codigo);
        const mockEventsForLoco = state.mockEventsDisabled || realEventsForLoco.length > 0 ? [] : sampleEvents7774.filter((event) => (event.locomotoraCodigo || '7774') === loco.codigo);
        const sourceEvents = mockEventsForLoco
          .concat(realEventsForLoco)
          .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.time).localeCompare(String(a.time)));
        const filteredEvents = sourceEvents.filter((event) => historyEventMatchesFilter(event) && historyEventMatchesSearch(event));
        const groupedEvents = groupHistoryEvents(filteredEvents);
        const stats = {
          preventivo: sourceEvents.filter((event) => event.kind === 'preventivo').length,
          correctivo: sourceEvents.filter((event) => event.kind === 'correctivo').length,
          libro: sourceEvents.filter((event) => event.kind === 'libro').length,

                <article class="history-kpi-card campana"><span>Eventos historicos</span><strong>${sourceEvents.length}</strong></article>
                <article class="history-kpi-card lavado"><span>Archivos asociados</span><strong>${stats.pdf + stats.fotos}</strong></article>

              <section class="history-event-filters" aria-label="Filtros del archivo historico">

      function historyModalLoco() {
        return selectedLoco()
          || locomotoras.find((item) => item.codigo === state.historyLocoCode)
          || locomotoras.find((item) => item.codigo === '7774')
          || locomotoras[0];
      }

      function interventionModalHtml() {
        const selected = selectedLoco();
        if (!state.interventionOpen || !selected) return '';

        return `
          <div class="modal-backdrop" role="presentation">
            <form class="intervention-modal" data-intervention-form>
              <div class="modal-heading">
                <div>
                  <span class="panel-kicker">Nueva intervencion</span>

              <label>
                Fecha
                <input inputmode="numeric" name="date" pattern="\\d{2}-\\d{2}-\\d{4}" placeholder="dd-mm-yyyy" type="text" value="${todayDisplayValue()}" required />

              <label>
                Tipo
                <select name="interventionClass" data-intervention-type required>
                  <option value="" ${state.interventionFormType ? '' : 'selected'} disabled>Seleccionar tipo</option>
                  <option value="correctivo" ${state.interventionFormType === 'correctivo' ? 'selected' : ''}>Correctivo</option>
                  <option value="preventivo" ${state.interventionFormType === 'preventivo' ? 'selected' : ''}>Preventivo</option>
                </select>
              </label>

              ${state.interventionFormType === 'preventivo' ? `
                <label>
                  Preventivo
                  <select name="preventiveCode" data-preventive-code required>
                    <option value="" ${state.preventiveFormCode ? '' : 'selected'} disabled>Seleccionar preventivo</option>
                    ${preventiveOptions.map((option) => `<option value="${option}" ${state.preventiveFormCode === option ? 'selected' : ''}>${option}</option>`).join('')}
                  </select>
                </label>
              ` : ''}

              ${state.interventionFormType === 'correctivo' ? `
                <label>
                  Especialidad
                  <select name="area" required>
                    <option value="" selected disabled>Seleccionar especialidad</option>
                    <option>Mecanica</option>
                    <option>Electrica</option>
                    <option>General</option>
                  </select>
                </label>
              ` : ''}

              <label>
                Tecnico / responsable
                ${state.interventionFormType === 'correctivo' ? `
                  <select name="technician" required>
                    <option value="" selected disabled>Seleccionar turno</option>
                    <option>Turno fijo</option>
                    <option>Turno rotativo</option>
                  </select>
                ` : `
                  <input name="technician" readonly value="${String(state.preventiveFormCode).startsWith('Numeral') ? 'Turno fijo' : 'Turno rotativo'}" />
                `}
              </label>

              <label>
                Detalle
                <textarea name="detail" rows="5" placeholder="Trabajo realizado, observaciones, repuestos, pendientes..." required></textarea>
              </label>

              <div class="modal-actions">
                <button class="secondary-action" data-close-intervention type="button">Cancelar</button>
                <button class="primary-action" type="submit">Guardar intervencion</button>
              </div>
            </form>
          </div>
        `;

      function bindEvents() {
        document.querySelectorAll('[data-tab]').forEach((button) => {
          button.addEventListener('click', () => setTab(button.dataset.tab));
        });

        document.querySelectorAll('[data-sidebar-tab]').forEach((button) => {

        });

            state.sidebarCollapsed = !state.sidebarCollapsed;
            render();
          });

              left: viewport.scrollLeft,
              top: viewport.scrollTop,
            };
          });
          button.addEventListener('click', () => {
            window.clearTimeout(selectTimer);

        document.querySelectorAll('[data-open-history]').forEach((button) => {

              openHistory(button.dataset.openHistory);
              return;

            if (button.classList.contains('panel-history-action')) {
              event.preventDefault();

        document.querySelectorAll('[data-open-attachment="pdf"]').forEach((button) => {

        document.querySelectorAll('[data-close-intervention]').forEach((button) => {
          button.addEventListener('click', closeIntervention);
        });

        document.querySelectorAll('[data-intervention-type]').forEach((select) => {
          select.addEventListener('change', () => {
            state.interventionFormType = select.value;
            state.preventiveFormCode = '';
            render();
          });
        });

        document.querySelectorAll('[data-preventive-code]').forEach((select) => {
          select.addEventListener('change', () => {
            state.preventiveFormCode = select.value;
            render();
          });
        });

        document.querySelectorAll('[data-intervention-form]').forEach((form) => {
          form.addEventListener('submit', registerIntervention);
        });

        document.querySelectorAll('[data-history-filter]').forEach((input) => {
          input.addEventListener('input', () => updateHistoryFilter(input.dataset.historyFilter, input.value));
          input.addEventListener('change', () => updateHistoryFilter(input.dataset.historyFilter, input.value));
        });

        document.querySelectorAll('[data-event-filter]').forEach((button) => {
          button.addEventListener('click', () => {
            state.historyEventFilter = button.dataset.eventFilter;
            render();
          });
        });

        document.querySelectorAll('[data-history-event-search]').forEach((input) => {
          input.addEventListener('input', () => {
            state.historySearch = input.value;
            render();
          });
        });

        document.querySelectorAll('[data-history-loco-select]').forEach((select) => {
          select.addEventListener('change', () => {
            state.historyLocoCode = select.value;
            const target = locomotoras.find((loco) => loco.codigo === select.value);
            state.historyTargetId = target?.id || null;
            state.selectedId = target?.id || null;

        document.querySelectorAll('[data-calendar-month]').forEach((input) => {

            state.calendarMonth = input.value;
            render();
          });

        document.querySelectorAll('[data-calendar-view]').forEach((button) => {
          button.addEventListener('click', () => {
            state.calendarView = button.dataset.calendarView;
            render();
          });

        document.querySelectorAll('[data-calendar-month-card]').forEach((button) => {

            state.calendarMonth = button.dataset.calendarMonthCard;
            render();
          });

        document.querySelectorAll('[data-calendar-new-task]').forEach((button) => {
          button.addEventListener('click', () => {
            state.calendarTaskModalOpen = true;
            render();
          });
        });

        document.querySelectorAll('[data-calendar-realization]').forEach((button) => {
          button.addEventListener('click', () => {
            state.calendarRealizationOpen = true;
            render();
          });
        });

        document.querySelectorAll('[data-clear-history]').forEach((button) => {
          button.addEventListener('click', () => handleHistoryCleanup(button.dataset.clearHistory));
        });

        document.querySelectorAll('[data-calendar-close]').forEach((button) => {
          button.addEventListener('click', () => {
            state.calendarTaskModalOpen = false;
            state.calendarRealizationOpen = false;
            render();
          });
        });

        document.querySelectorAll('[data-calendar-task-form]').forEach((form) => {
          const updateCalendarTaskBranches = () => {
            const taskKind = form.querySelector('[data-calendar-task-kind]')?.value || 'preventivo';
            const preventiveAsset = form.querySelector('[data-calendar-preventive-asset]')?.value || 'locomotora';
            form.querySelectorAll('[data-task-branch]').forEach((branch) => {
              branch.style.display = branch.dataset.taskBranch === taskKind ? '' : 'none';
            });
            form.querySelectorAll('[data-task-not-campaign]').forEach((node) => {
              node.style.display = taskKind === 'campana' ? 'none' : '';
            });
            form.querySelectorAll('[data-task-other-only]').forEach((node) => {
              node.style.display = taskKind === 'otro' ? '' : 'none';
            });
            form.querySelectorAll('[data-preventive-locomotive], [data-preventive-turn]').forEach((node) => {
              node.style.display = preventiveAsset === 'locomotora' ? '' : 'none';
            });
            form.querySelectorAll('[data-preventive-coach]').forEach((node) => {
              node.style.display = preventiveAsset === 'coche' ? '' : 'none';
            });
            const locoPreventive = form.querySelector('[data-calendar-loco-preventive]')?.value || 'E';
            form.querySelectorAll('[data-preventive-turn]').forEach((node) => {
              node.style.display = preventiveAsset === 'locomotora' && !String(locoPreventive).startsWith('Numeral') ? '' : 'none';
            });
          };
          form.querySelector('[data-calendar-task-kind]')?.addEventListener('change', updateCalendarTaskBranches);
          form.querySelector('[data-calendar-preventive-asset]')?.addEventListener('change', updateCalendarTaskBranches);
          form.querySelector('[data-calendar-loco-preventive]')?.addEventListener('change', updateCalendarTaskBranches);
          updateCalendarTaskBranches();

          form.addEventListener('submit', (event) => {
            event.preventDefault();
            const formData = new FormData(form);
            const taskKind = formData.get('taskKind');
            const preventivoActivo = formData.get('preventivoActivo');
            const preventivoCodigo = preventivoActivo === 'coche' ? formData.get('preventivoCocheCodigo') : formData.get('preventivoLocomotoraCodigo');
            const nombreCampana = String(formData.get('nombreCampana') || '').trim();
            const isNumeral = taskKind === 'preventivo' && String(preventivoCodigo).startsWith('Numeral');
            const tipo = taskKind === 'campana'
              ? 'campana'
              : taskKind === 'otro'
                ? 'otro'
                : isNumeral
                  ? 'numeral'
                  : preventivoActivo === 'coche'
                    ? 'preventivo-coche'
                    : 'preventivo-locomotora';
            const descripcion = taskKind === 'campana'
              ? nombreCampana || 'Campana sin nombre'
              : taskKind === 'preventivo'
                ? `${isNumeral ? preventivoCodigo : `Preventivo ${preventivoCodigo}`} ${formData.get('unidad')}.`
                : formData.get('descripcion');
            const campanaActivo = formData.get('campanaActivo');
            const activo = taskKind === 'campana'
              ? campanaActivo
              : taskKind === 'preventivo'
                ? preventivoActivo === 'coche' ? 'Coche' : 'Locomotora'
                : formData.get('otroActivo');
            const nivelPlanificacion = taskKind === 'campana' || isNumeral ? 'anual' : taskKind === 'preventivo' ? 'semanal' : 'mensual';
            const turnDurations = { E: 1, A: 2, AB: 3, ABC: 6 };
            state.calendarTasks = [{
              id: `task-${Date.now()}`,
              tipo,
              nivelPlanificacion,
              activo,
              unidad: taskKind === 'campana' ? campanaActivo : formData.get('unidad'),
              fechaProgramada: formData.get('fechaProgramada'),
              fechaFin: taskKind === 'campana' ? '' : formData.get('fechaFin'),
              preventivoCodigo,
              turno: formData.get('turno'),
              duracionTurnos: tipo === 'preventivo-locomotora' ? turnDurations[preventivoCodigo] : '',
              duracionTarea: taskKind === 'campana' ? formData.get('duracionTarea') : '',
              frecuencia: taskKind === 'campana' ? formData.get('frecuencia') : 'unica',
              responsable: taskKind === 'otro' ? formData.get('responsable') : 'Planificacion MR',
              especialidad: formData.get('especialidad') || 'General',
              descripcion,
              observaciones: taskKind === 'otro' ? formData.get('observaciones') : '',
              estado: formData.get('fechaProgramada') < '2026-06-22' ? 'vencida' : 'pendiente',
            }, ...state.calendarTasks];
            localStorage.setItem(storageKeys.calendarTasksDisabled, 'false');
            saveCalendarTasks();
            state.calendarTaskModalOpen = false;
            render();
          });
        });

        document.querySelectorAll('[data-calendar-realization-form]').forEach((form) => {
          form.addEventListener('submit', (event) => {
            event.preventDefault();
            const formData = new FormData(form);
            const task = state.calendarTasks.find((item) => item.id === formData.get('taskId'));
            if (!task) return;
            const units = String(formData.get('unidadesRealizadas')).split(',').map((unit) => unit.trim()).filter(Boolean);
            state.calendarTasks = state.calendarTasks.map((item) => item.id === task.id ? { ...item, estado: 'completada', fechaRealizada: formData.get('fechaRealizada') } : item);
            saveCalendarTasks();
            units.filter((unit) => /^E\d{3}$|^77\d{2}$|^EM\d{2}$/.test(unit)).forEach((unit) => {
              state.historyCustomEvents = [{
                id: `${unit}-cal-${Date.now()}`,
                locomotoraCodigo: unit,
                date: formData.get('fechaRealizada'),
                dateLabel: formatHistoryDateLabel(formData.get('fechaRealizada')),
                time: '08:00',
                kind: task.tipo === 'campana' ? 'campana' : task.tipo === 'numeral' ? 'numeral' : task.tipo.startsWith('preventivo') ? 'preventivo' : 'otro',
                origin: task.especialidad,
                description: `${task.descripcion} ${formData.get('observaciones') || ''}`.trim(),
                responsible: formData.get('responsable'),
                automatic: false,
                attachments: {},
              }, ...state.historyCustomEvents];
            });
            saveCustomHistoryEvents();
            state.calendarRealizationOpen = false;
            render();
          });
        });

        document.querySelectorAll('[data-open-history-event]').forEach((button) => {
          button.addEventListener('click', () => {
            const selected = selectedLoco();
            if (selected) {
              state.historyLocoCode = selected.codigo;
              state.historyTargetId = selected.id;
            }
            state.historyEventModalOpen = true;
            render();
          });
        });

        document.querySelectorAll('[data-close-history-event]').forEach((button) => {
          button.addEventListener('click', () => {
            state.historyEventModalOpen = false;
            render();
          });
        });

        document.querySelectorAll('[data-history-event-form]').forEach((form) => {
          const updateHistoryEventBranches = () => {
            const tipo = form.querySelector('[data-history-event-type]')?.value || '';
            form.querySelectorAll('[data-history-branch]').forEach((branch) => {
              const branchName = branch.dataset.historyBranch;
              const visible = branchName === tipo || (branchName === 'empty' && !tipo);
              branch.style.display = visible ? '' : 'none';
            });
            const criticality = form.querySelector('[data-history-criticality]');
            if (criticality) criticality.style.display = tipo ? '' : 'none';
            const preventiveCode = form.querySelector('[data-history-preventive-code]')?.value || 'E';
            const preventiveResponsible = form.querySelector('[data-history-preventive-responsible]');
            if (preventiveResponsible) preventiveResponsible.value = String(preventiveCode).startsWith('Numeral') ? 'Turno fijo' : 'Turno rotativo';
          };
          form.querySelector('[data-history-event-type]')?.addEventListener('change', updateHistoryEventBranches);
          form.querySelector('[data-history-preventive-code]')?.addEventListener('change', updateHistoryEventBranches);
          updateHistoryEventBranches();

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (form.dataset.submitting === 'true') return;
            form.dataset.submitting = 'true';
            const submitButton = form.querySelector('button[type="submit"]');
            if (submitButton) {
              submitButton.disabled = true;
              submitButton.textContent = 'Guardando...';
            }

            try {
              const formData = new FormData(form);
              const files = formData.getAll('adjuntos').filter((file) => file && file.name);
              let attachments;
              try {
                attachments = await buildLocalAttachments(files);
              } catch {
                const pdfFiles = files.filter((file) => file.type === 'application/pdf' || String(file.name).toLowerCase().endsWith('.pdf'));
                const photoFiles = files.filter((file) => file.type?.startsWith('image/'));
                const otFiles = files.filter((file) => String(file.name).toLowerCase().includes('ot'));
                attachments = {
                  pdf: pdfFiles.length > 0,
                  pdfName: pdfFiles.map((file) => file.name).join(', '),
                  pdfUrl: '',
                  photo: photoFiles.length > 0,
                  photoName: photoFiles.map((file) => file.name).join(', '),
                  ot: otFiles.length > 0,
                  otName: otFiles.map((file) => file.name).join(', '),
                };
              }
              const tipo = formData.get('tipo');
              const preventivoCodigo = formData.get('preventivoCodigo');
              const especialidad = tipo === 'correctivo'
                ? formData.get('especialidadCorrectivo')
                : tipo === 'preventivo'
                  ? 'Todas'
                  : tipo === 'alistamiento'
                    ? formData.get('especialidadAlistamiento')
                    : tipo === 'lavado'
                      ? 'Lavado'
                      : 'General';
              const description = tipo === 'preventivo'
                ? formData.get('descripcionPreventivo')
                : tipo === 'correctivo'
                  ? formData.get('descripcionCorrectivo')
                  : tipo === 'alistamiento'
                    ? formData.get('descripcionAlistamiento')
                    : tipo === 'lavado'
                      ? formData.get('descripcionLavado')
                      : '';
              const responsable = tipo === 'preventivo'
                ? String(preventivoCodigo).startsWith('Numeral') ? 'Turno fijo' : 'Turno rotativo'
                : tipo === 'correctivo'
                  ? formData.get('responsableCorrectivo')
                : tipo === 'alistamiento'
                  ? 'Turno rotativo'
                  : tipo === 'lavado'
                    ? 'Sector lavadero'
                    : 'Sin responsable asignado';
              const eventId = `${formData.get('locomotoraCodigo')}-${Date.now()}`;
              state.historyCustomEvents = [{
                id: eventId,
                locomotoraCodigo: formData.get('locomotoraCodigo'),
                date: formData.get('fecha'),
                dateLabel: formatHistoryDateLabel(formData.get('fecha')),
                time: formData.get('hora'),
                kind: tipo,
                origin: tipo === 'preventivo' ? `Preventivo ${preventivoCodigo}` : especialidad,
                description,
                responsible: responsable,
                automatic: false,
                attachments,
                criticidad: formData.get('criticidad') || 'baja',
              }, ...state.historyCustomEvents];
              try {
                saveCustomHistoryEvents();
              } catch (storageError) {
                console.warn('El evento se cargo, pero el navegador no pudo persistir el adjunto completo.', storageError);
              }
              state.historyLocoCode = formData.get('locomotoraCodigo');
              const targetLoco = locomotoras.find((loco) => loco.codigo === formData.get('locomotoraCodigo'));
              if (targetLoco) {
                state.selectedId = targetLoco.id;
                state.historyTargetId = targetLoco.id;
                state.histories = {
                  ...state.histories,
                  [targetLoco.id]: sortHistoryDescending([
                    {
                      id: eventId,
                      date: formData.get('fecha'),
                      type: tipo === 'preventivo' ? `Preventivo ${preventivoCodigo}` : eventTypeLabel(tipo),
                      interventionClass: tipo,
                      preventiveCode: tipo === 'preventivo' ? preventivoCodigo : '',
                      area: tipo === 'preventivo' ? 'General' : especialidad,
                      locomotoraId: targetLoco.id,
                      locomotoraCodigo: targetLoco.codigo,
                      technician: responsable,
                      detail: description,
                      criticidad: formData.get('criticidad') || 'baja',
                    },
                    ...(state.histories[targetLoco.id] || []),
                  ]),
                };
                try {
                  saveHistories();
                } catch (storageError) {
                  console.warn('El panel historico se actualizo, pero no se pudo persistir localmente.', storageError);
                }
              }
              state.historyEventModalOpen = false;
              render();
            } catch (error) {
              console.warn('Error no bloqueante al guardar evento historico.', error);
              form.dataset.submitting = 'false';
              state.historyEventModalOpen = false;
              render();
            }
          });
        });

        document.querySelectorAll('[data-export-history]').forEach((button) => {
          button.addEventListener('click', exportHistoryBackup);
        });

        document.querySelectorAll('[data-import-history]').forEach((input) => {
          input.addEventListener('change', importHistoryBackup);
        });

        document.querySelectorAll('[data-reprocess-history]').forEach((input) => {
          input.addEventListener('change', (event) => importHistoryBackup(event, { reprocess: true }));
        });

        const viewport = document.querySelector('.yard-viewport');
        if (!viewport) return;

        if (!state.yardViewportPrimed) {
          viewport.scrollLeft = Math.max((baseYardWidth * mapZoom - viewport.clientWidth) * 0.58, 0);
          viewport.scrollTop = 48;
          state.yardViewportPrimed = true;
        }

        let drag = null;
        viewport.addEventListener('pointerdown', (event) => {
          if (event.button !== 0 || event.target.closest('button')) return;
          drag = {
            id: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            left: viewport.scrollLeft,
            top: viewport.scrollTop,
          };
          viewport.classList.add('is-dragging');
          viewport.setPointerCapture(event.pointerId);
        });
        viewport.addEventListener('pointermove', (event) => {
          if (!drag) return;
          viewport.scrollLeft = drag.left - (event.clientX - drag.x);
          viewport.scrollTop = drag.top - (event.clientY - drag.y);
        });
        const stop = () => {
          drag = null;
          viewport.classList.remove('is-dragging');
        };
        viewport.addEventListener('pointerup', stop);
        viewport.addEventListener('pointercancel', stop);
        viewport.addEventListener('pointerleave', stop);
      }

      function render() {
        root.innerHTML = `
          <div class="app-shell">
            ${appSidebarHtml()}
            <div class="app-content">
              ${moduleTabsHtml()}
              ${state.tab === 'inicio' ? homeHtml() : state.tab === 'patio' ? patioHtml() : state.tab === 'historial' ? historyPageHtml() : state.tab === 'coches' ? cochesHtml() : state.tab === 'calendario' ? calendarHtml() : state.tab === 'configuracion' ? configurationHtml() : locosHtml()}
              ${interventionModalHtml()}
              ${historyEventModalHtml(historyModalLoco())}
            </div>
          </div>
        `;
        bindEvents();
      }

      render();
    </script>
  </body>
</html>
